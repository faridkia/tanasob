server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Baseline security headers — Django's own middleware only covers /api/
    # and /admin/ responses, not the static React shell served here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin reverse proxy to the backend container — the browser only
    # ever talks to this one origin, so CORS never comes into play.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $http_host;
    }
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $http_host;
    }

    # Hashed asset filenames (Vite's default) are safe to cache forever.
    # nginx note: a location with its own add_header does NOT inherit the
    # server-level ones above — they have to be repeated here too, or this
    # response silently loses them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router client-side routing — unmatched paths fall back to
    # index.html instead of a nginx 404. index.html itself must never be
    # cached (unlike /assets/, its content-hashed script/style references
    # change on every build) or the browser can keep serving a stale build
    # indefinitely with no way to detect it changed.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
