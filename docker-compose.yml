services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: "tanasob.flora-app.ir,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://tanasob.flora-app.ir,http://tanasob.flora-app.ir"
      HTTPS_ENABLED: "False"
    ports:
      - "30081:8000"   # 8000-8013 are taken on the target server
    volumes:
      # Uploaded diet-plan photos, etc. — otherwise a `docker compose build`
      # would wipe them (media/ is never baked into the image).
      - media_data:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "30080:80"     
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
